<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대학원생 AI 활용 현황 및 연구지원 요구 설문조사</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1d2430; --muted: #5d6778; --line: #dfe3ea;
    --accent: #1f5fbf; --accent-soft: #e8f0fc; --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  header.top { background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--accent);
    border-radius: 12px; padding: 24px; margin-bottom: 16px; }
  header.top h1 { font-size: 22px; margin: 0 0 8px; line-height: 1.4; }
  header.top p { margin: 6px 0; color: var(--muted); font-size: 15px; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 0 0 16px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .section-title { font-size: 18px; font-weight: 700; margin: 8px 0 12px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
  .q.invalid { border-color: var(--danger); }
  .q h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .q h2 .req { color: var(--danger); margin-left: 4px; }
  .q .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .q .note { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; color: var(--muted); margin: 0 0 12px; }
  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .opt:hover { background: var(--accent-soft); }
  .opt.checked { border-color: var(--accent); background: var(--accent-soft); }
  .opt.disabled { opacity: .45; cursor: not-allowed; }
  .opt input { margin-top: 5px; accent-color: var(--accent); }
  .opt .other-input { display: block; width: 100%; margin-top: 6px; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .scale .opt { flex-direction: column; align-items: center; text-align: center; font-size: 13px; padding: 10px 4px; }
  input[type=text], input[type=tel], textarea { width: 100%; font: inherit; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  textarea { min-height: 110px; resize: vertical; }
  .err { color: var(--danger); font-size: 13px; margin-top: 6px; display: none; }
  .q.invalid .err { display: block; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
  button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.secondary { background: #fff; color: var(--ink); }
  button:disabled { opacity: .6; cursor: wait; }
  .done { text-align: center; padding: 48px 24px; }
  .done h2 { font-size: 20px; }
  .hidden { display: none; }
  .status { color: var(--danger); margin-top: 12px; font-size: 14px; }
  @media (max-width: 480px) { .scale { grid-template-columns: 1fr; } .scale .opt { flex-direction: row; text-align: left; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>대학원생 AI 활용 현황 및 연구지원 요구 설문조사</h1>
    <p>대학원생의 연구 과정에서 AI를 어떻게 활용하고 있는지, 도서관에 어떤 교육과 지원이 필요한지 알아보기 위한 설문입니다. 응답 결과는 도서관 교육 프로그램과 연구지원 서비스 기획에만 활용합니다.</p>
    <p>응답에 따라 이어지는 문항이 달라지며, 약 10분이 걸립니다. <span style="color:var(--danger)">*</span> 표시는 필수 문항입니다.</p>
  </header>

  <div class="progress"><div id="bar"></div></div>
  <main id="app"></main>
</div>

<script>
// 응답을 받을 Google Apps Script 웹 앱 주소
const ENDPOINT = "https://script.google.com/macros/s/AKfycbx57l6vxKGRwFzoDhFW44LUoRH4gWffV4F5xVsCzKagJArySmf6jem46p0izvE-N0NAYQ/exec";

const OTHER = "기타(직접 입력)";

  { id: "s1", title: "기본 정보", questions: [

    { id: "Q4", col: "Q4 학위논문 단계", text: "학위논문은 현재 어느 단계에 있습니까?", type: "single",
      options: ["아직 시작하지 않음(수업 중심)", "연구 주제·연구 방법을 정하는 중", "데이터 수집·분석 중", "논문 작성·심사 중"] },
    { id: "Q5", col: "Q5 AI 사용 빈도", text: "연구 활동(논문 작성, 문헌 탐색, 데이터 분석 등)에 AI를 얼마나 자주 사용하십니까?", type: "single",

                "여러 AI 도구를 함께 쓰거나, 코드 실행·자동화로 작업 과정 일부를 맡긴다(AI 에이전트 등).",

    { id: "Q9", col: "Q9 AI 활용 어려움", text: "AI를 연구에 활용할 때 겪는 어려움은 무엇입니까?", type: "multi", max: 3,
      options: ["어떤 도구가 내 연구에 적합한지 모르겠다.",

                "연구자료를 입력·업로드해도 되는지 판단하기 어렵다.",

                "특별한 어려움이 없다.", OTHER] },
    { id: "Q10", col: "Q10 AI 활용 연구 단계", text: "AI를 활용하는 연구 단계를 모두 선택해 주세요.", type: "multi",
      options: ["연구 주제·연구 질문 설정", "연구 방법·분석 틀 설계", "문헌 탐색", "문헌 읽기·요약·비교 정리",
                "데이터 수집·정제", "데이터 분석·코딩·결과 해석", "초안 작성", "번역·교정·참고문헌 정리",

    { id: "Q11", col: "Q11 주 활용 단계", text: "이 중 AI를 가장 많이 활용하는 단계 하나를 선택해 주세요.", type: "single",
      options: ["문헌 탐색 또는 문헌 읽기·요약", "데이터 수집·분석·코딩",
                "초안 작성, 번역·교정, 투고 대응", "연구 주제·방법 설정, 발표 자료 등 그 외"] },
  ], next: a => ({
      "문헌 탐색 또는 문헌 읽기·요약": "s31",
      "데이터 수집·분석·코딩": "s32",
      "초안 작성, 번역·교정, 투고 대응": "s33"
    })[a.Q11] || "s4" },

  { id: "sB", title: "AI를 사용하지 않는 이유", questions: [
    { id: "Q12", col: "Q12 AI 미사용 이유", text: "연구에 AI를 사용하지 않는 이유는 무엇입니까?", type: "multi", max: 2,
      options: ["필요성을 느끼지 못한다.", "어떻게 활용해야 할지 모른다.", "답변의 정확성을 신뢰하기 어렵다.",

  { id: "s31", title: "문헌 탐색·읽기", questions: [

      options: ["검색 키워드·검색식 만들기", "조건(최근 5년, 피인용 수 등)을 제시해 문헌 목록 받기",
                "논문 요약·핵심 내용 파악", "여러 논문의 연구 방법·결과 비교 정리",

    { id: "Q16", col: "Q16 참고문헌 선정 기준", text: "논문을 참고문헌으로 고를 때 가장 중요하게 보는 기준은 무엇입니까?", type: "multi", max: 2,
      options: ["연구 주제와의 적합성", "최신성", "피인용 수", "학술지의 영향력·등급",

    { id: "Q21", col: "Q21 직접 수행 작업", text: "AI에 맡기지 않고 직접 수행하는 작업은 무엇입니까?", type: "multi",

                "학술 DB AI 실습: Scopus AI·WoS AI로 문헌 탐색과 연구 동향 파악",
                "범용 AI와 학술 DB 연계: AI에서 얻은 키워드·문헌을 도서관 DB 검색으로 확장",
                "AI 답변과 출처 검증: 제시된 문헌의 실제 존재 여부와 원문 맥락 확인",
                "앵커 논문에서 연구 질문 도출 실습",
                "AI를 활용한 데이터 분석·코딩과 결과 검증",
                "논문 읽기: 어려운 논문의 구조·개념·방법을 AI와 함께 이해",
                "문헌·인용 관리: AI로 찾은 문헌을 서지관리도구(EndNote, Zotero 등)로 관리",
                "AI 연구윤리: 학술지·학위논문의 AI 활용 고지 기준과 유의점",
                "투고 후보 학술지 탐색", OTHER] },
    { id: "Q26", col: "Q26 희망 교육 수준", text: "희망하는 교육 수준은 무엇입니까?", type: "single",
      options: ["기초: 도구 소개와 기본 사용법", "심화: 내 연구 주제로 하는 실습 중심", "기초와 심화를 차례로 듣고 싶다"] },
    { id: "Q27", col: "Q27 선호 교육 형태", text: "선호하는 교육 형태는 무엇입니까?", type: "multi", max: 2,
      options: ["대면 실습 교육", "실시간 온라인 교육", "녹화 강의", "전공별 소규모 교육", "강의 없이 가이드·매뉴얼 자료만 제공"] },
    { id: "Q28", col: "Q28 참여 희망 시기", text: "참여하기 좋은 시기는 언제입니까?", type: "single",
      options: ["학기 중 평일 낮", "학기 중 평일 저녁", "방학 중 집중 과정", "상관없다"] },
  ], next: () => "s5" },

  { id: "s5", title: "도서관 연구지원 서비스", questions: [
    { id: "Q29", col: "Q29 도서관 이용 목적", text: "연구를 위해 도서관(홈페이지 포함)을 주로 어떤 목적으로 이용하십니까?", type: "multi", max: 2,
      options: ["논문 원문 다운로드·확인", "학술 DB에서 문헌 검색", "단행본 대출", "열람실·세미나실 등 공간 이용",
                "교육·상담 프로그램 참여", "거의 이용하지 않는다"] },
    { id: "Q30", col: "Q30 문헌 검색 경로", text: "주로 이용하는 문헌 검색 경로는 무엇입니까?", type: "multi", max: 2,
      options: ["구글 스칼라", "도서관 통합검색", "Web of Science·Scopus", "국내 DB(RISS, KCI, DBpia 등)",
                "AI 도구(ChatGPT, Perplexity 등)", "지도교수·연구실에서 공유받는 자료"] },
    { id: "Q31", col: "Q31 학술 AI 서비스 인지도", text: "도서관에서 제공하는 학술 AI 서비스(Scopus AI, Web of Science Research Assistant, DBpia AI 등)를 얼마나 알고 계십니까?", type: "single",
      options: ["제공되는지 몰랐다", "알고 있지만 사용한 적은 없다", "사용한 적은 있지만 계속 쓰지는 않는다", "현재 연구에 주기적으로 이용하고 있다"] },
  ], next: a => a.Q31 === "현재 연구에 주기적으로 이용하고 있다" ? "s52"
              : (a.Q31 === "제공되는지 몰랐다" ? "s6" : "s51") },

  { id: "s51", title: "도서관 연구지원 서비스", questions: [
    { id: "Q31-1", col: "Q31-1 학술 AI 미이용 이유", text: "학술 AI 서비스를 이용하지 않거나 계속 쓰지 않는 이유는 무엇입니까?", type: "multi", max: 2,
      options: ["구체적인 기능이나 활용 방법을 잘 모른다.", "기존에 쓰는 AI 도구(ChatGPT, Claude 등)로 충분하다.",
                "접속·이용 절차가 번거롭다.", "검색 결과나 답변이 기대보다 유용하지 않다.",
                "내 분야(국내 문헌 중심 등)에 맞지 않는다.", OTHER] },
  ], next: () => "s6" },

  { id: "s52", title: "도서관 연구지원 서비스", questions: [
    { id: "Q31-2", col: "Q31-2 이용 학술 AI 서비스", text: "주로 이용하는 학술 AI 서비스를 모두 선택해 주세요.", type: "multi",
      options: ["Scopus AI", "Web of Science Research Assistant", "DBpia AI", OTHER] },
  ], next: () => "s6" },

  { id: "s6", title: "희망 지원과 마무리", questions: [
    { id: "Q32", col: "Q32 희망 연구지원", text: "도서관이 제공하기를 바라는 연구지원은 무엇입니까?", type: "multi", max: 3,
      options: ["연구 기초 교육: 연구방법론·통계 기초", "논문 읽는 법 교육", "AI 리터러시·연구윤리 교육",
                "연구 주제·연구 방법 설정 사례 안내", "잘 쓴 논문(서론 등) 사례 모음", "논문 투고 절차 안내",
                "학위논문 작성 지원(양식, AI 보조 활용 방법)", "연구 질문·문헌 탐색 1:1 상담",
                "공공·연구 데이터 찾기 지원", "관심사별 독서·논문 읽기 모임",
                "같은 주제·방법론 연구자 간 스터디 매칭", OTHER] },
    { id: "Q33", col: "Q33 자유 의견", text: "AI로 해결하고 싶은 연구 작업이나 도서관에 바라는 점이 있다면 자유롭게 적어 주세요.", type: "text", required: false },
    { id: "Q34", col: "Q34 개인정보 동의", text: "개인정보 수집·이용에 동의하십니까? 동의한 응답자에게만 경품을 발송합니다.", type: "single",
      note: "수집 목적: 응답자 경품 발송 / 수집 항목: 휴대폰 번호 / 보유 기간: 경품 발송 후 즉시 파기",
      options: ["동의합니다", "동의하지 않습니다"] },
  ], next: a => a.Q34 === "동의합니다" ? "s7" : null },

  { id: "s7", title: "경품 수령 정보", questions: [
    { id: "Q34-1", col: "Q34-1 휴대폰 번호", text: "경품을 받을 휴대폰 번호를 입력해 주세요('-' 제외).", type: "tel" },
  ], next: () => null },
];

const ORDER = ["s1", "sA", "sB", "s31", "s32", "s33", "s4", "s5", "s51", "s52", "s6", "s7"];
const byId = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

const answers = {};      // 질문 id → 값(문자열 또는 배열)
const otherText = {};    // 질문 id → 기타 입력값
const history = [];      // 지나온 섹션 id
let current = "s1";

const app = document.getElementById("app");
const bar = document.getElementById("bar");

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function hintFor(q) {
  if (q.type === "multi") return q.max ? `최대 ${q.max}개까지 선택할 수 있습니다.` : "해당하는 것을 모두 선택해 주세요.";
  return null;
}

function renderQuestion(q) {
  const required = q.required !== false;
  const box = el("div", { class: "q", id: "q-" + q.id });
  box.append(el("h2", {}, `${q.id}. ${q.text}`, required ? el("span", { class: "req" }, "*") : null));
  const hint = hintFor(q);
  if (hint) box.append(el("p", { class: "hint" }, hint));
  if (q.note) box.append(el("p", { class: "note" }, q.note));

  if (q.type === "text") {
    const ta = el("textarea", { oninput: e => answers[q.id] = e.target.value });
    ta.value = answers[q.id] || "";
    box.append(ta);
  } else if (q.type === "tel") {
    const inp = el("input", { type: "tel", inputmode: "numeric", maxlength: "11", placeholder: "01012345678",
      oninput: e => { e.target.value = e.target.value.replace(/\D/g, ""); answers[q.id] = e.target.value; } });
    inp.value = answers[q.id] || "";
    box.append(inp);
  } else {
    const multi = q.type === "multi";
    const wrap = el("div", { class: q.type === "scale" ? "scale" : "" });
    const name = "n-" + q.id;
    q.options.forEach((opt, i) => {
      const isOther = opt === OTHER;
      const selected = multi ? (answers[q.id] || []).includes(opt) : answers[q.id] === opt;
      const input = el("input", { type: multi ? "checkbox" : "radio", name, value: opt, checked: selected });
      const label = el("label", { class: "opt" + (selected ? " checked" : ""), for: name + "-" + i }, input);
      input.id = name + "-" + i;
      const textWrap = el("span", {}, isOther ? "기타" : opt);
      if (isOther) {
        const oi = el("input", { type: "text", class: "other-input" + (selected ? "" : " hidden"), placeholder: "직접 입력",
          oninput: e => otherText[q.id] = e.target.value });
        oi.value = otherText[q.id] || "";
        textWrap.append(oi);
      }
      label.append(textWrap);
      input.addEventListener("change", () => {
        if (multi) {
          const cur = new Set(answers[q.id] || []);
          input.checked ? cur.add(opt) : cur.delete(opt);
          answers[q.id] = q.options.filter(o => cur.has(o));
        } else {
          answers[q.id] = opt;
        }
        refreshOptions(q, wrap);
        box.classList.remove("invalid");
      });
      wrap.append(label);
    });
    box.append(wrap);
    refreshOptions(q, wrap);
  }
  box.append(el("div", { class: "err" }, "응답이 필요합니다."));
  return box;
}

function refreshOptions(q, wrap) {
  const multi = q.type === "multi";
  const sel = multi ? (answers[q.id] || []) : [answers[q.id]];
  const full = multi && q.max && sel.length >= q.max;
  wrap.querySelectorAll("label.opt").forEach(label => {
    const input = label.querySelector("input[type=radio],input[type=checkbox]");
    const on = sel.includes(input.value);
    input.checked = on;
    label.classList.toggle("checked", on);
    input.disabled = full && !on;
    label.classList.toggle("disabled", full && !on);
    const oi = label.querySelector(".other-input");
    if (oi) oi.classList.toggle("hidden", !on);
  });
}

function validate(section) {
  let firstBad = null;
  for (const q of section.questions) {
    if (q.required === false) continue;
    const v = answers[q.id];
    let ok = Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim());
    const usesOther = Array.isArray(v) ? v.includes(OTHER) : v === OTHER;
    if (ok && usesOther && !(otherText[q.id] || "").trim()) ok = false;
    if (ok && q.type === "tel" && !/^01\d{8,9}$/.test(v)) ok = false;
    const box = document.getElementById("q-" + q.id);
    box.classList.toggle("invalid", !ok);
    if (!ok) {
      box.querySelector(".err").textContent =
        q.type === "tel" ? "휴대폰 번호를 숫자만 10~11자리로 입력해 주세요."
        : usesOther && v && v.length !== 0 ? "'기타' 내용을 입력해 주세요." : "응답이 필요합니다.";
      if (!firstBad) firstBad = box;
    }
  }
  if (firstBad) firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
  return !firstBad;
}

function render() {
  const s = byId[current];
  const page = el("div");
  page.append(el("div", { class: "section-title" }, s.title));
  s.questions.forEach(q => page.append(renderQuestion(q)));
  const isLast = s.next(answers) === null;
  const status = el("div", { class: "status" });
  const nextBtn = el("button", { class: "primary", onclick: () => go(nextBtn, status) }, isLast ? "제출" : "다음");
  const prevBtn = history.length ? el("button", { class: "secondary", onclick: back }, "이전") : el("span");
  page.append(el("div", { class: "nav" }, prevBtn, nextBtn), status);
  // 마지막 섹션 여부가 응답에 따라 바뀔 수 있어(Q34) 선택 시 버튼 글자를 갱신
  page.addEventListener("change", () => { nextBtn.textContent = s.next(answers) === null ? "제출" : "다음"; });
  app.replaceChildren(page);
  const pos = ORDER.indexOf(current);
  bar.style.width = Math.round((pos / ORDER.length) * 100) + "%";
  window.scrollTo({ top: 0 });
}

function back() {
  current = history.pop();
  render();
}

async function go(btn, status) {
  const s = byId[current];
  if (!validate(s)) return;
  const nxt = s.next(answers);
  if (nxt) { history.push(current); current = nxt; render(); return; }
  btn.disabled = true; btn.textContent = "제출 중…"; status.textContent = "";
  try {
    await submit();
    bar.style.width = "100%";
    app.replaceChildren(el("div", { class: "q done" },
      el("h2", {}, "응답이 제출되었습니다."),
      el("p", {}, "설문에 참여해 주셔서 감사합니다. 보내 주신 의견은 도서관 교육과 연구지원 서비스 기획에 활용하겠습니다.")));
    window.scrollTo({ top: 0 });
  } catch (err) {
    btn.disabled = false; btn.textContent = "제출";
    status.textContent = "제출에 실패했습니다. 잠시 후 다시 시도해 주세요. (" + err.message + ")";
  }
}

function valueOf(q) {
  const v = answers[q.id];
  const fill = o => o === OTHER ? "기타: " + (otherText[q.id] || "").trim() : o;
  if (Array.isArray(v)) return v.map(fill).join("; ");
  return v ? fill(v) : "";
}

async function submit() {
  // 실제로 지나온 섹션의 응답만 보냄(건너뛴 분기의 응답은 제외)
  const path = [...history, current];
  const payload = {};
  for (const sid of path) for (const q of byId[sid].questions) payload[q.col] = valueOf(q);
  const res = await fetch(ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "저장 실패");
}

render();
</script>
</body>
</html>
